[env:t_encoder_pro]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = large_spiffs_16MB.csv

lib_extra_dirs =
  ../vendor/T-Encoder-Pro/libraries

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  olikraus/U8g2

build_src_filter =
  +<main.cpp>
  -<smoke.cpp>

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -I../vendor/T-Encoder-Pro/libraries/Mylibrary
